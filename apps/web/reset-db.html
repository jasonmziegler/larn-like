<!DOCTYPE html>
<html>
<head>
    <title>Reset Larn-Like Database</title>
</head>
<body>
    <h1>Database Reset Tool</h1>
    <p>Click the button below to delete the game database and force a fresh migration.</p>
    <button onclick="resetDB()">Reset Database</button>
    <div id="status"></div>
    
    <script>
        function resetDB() {
            const dbName = 'larn-like-db';
            const status = document.getElementById('status');
            status.innerHTML = 'Deleting database...';
            
            const request = indexedDB.deleteDatabase(dbName);
            
            request.onsuccess = () => {
                status.innerHTML = '<p style="color: green;">Database deleted successfully! You can now reload the game.</p>';
            };
            
            request.onerror = () => {
                status.innerHTML = '<p style="color: red;">Error deleting database: ' + request.error + '</p>';
            };
            
            request.onblocked = () => {
                status.innerHTML = '<p style="color: orange;">Database deletion blocked. Close all game tabs and try again.</p>';
            };
        }
    </script>
</body>
</html>
